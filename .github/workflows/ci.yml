name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # 纯逻辑层（GPT / vmdk）跨平台可跑：设备访问被内存设备替身替代
      - name: Unit tests (cross-platform)
        if: runner.os != 'Windows'
        run: python -m unittest tests.test_gpt tests.test_vmdk -v

      # Windows 才有设备层（safeio 走 ctypes / kernel32）
      - name: Unit tests (full suite)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -v

      - name: Byte-compile
        run: python -m compileall -q p2v tests
