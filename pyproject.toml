[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2v-toolkit"
version = "0.1.0"
description = "把物理盘上的系统卷 + ESP 导出为可引导 vmdk（只读、定向、沿用原 GUID）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Tairitsu" }]
keywords = ["p2v", "vmware", "vmdk", "gpt", "disk-imaging", "physical-to-virtual", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
p2v = "p2v.__main__:main"

# 仓库地址在公开后补上，例如：
# [project.urls]
# Source = "https://github.com/<owner>/p2v-toolkit"

[tool.setuptools]
packages = ["p2v"]
